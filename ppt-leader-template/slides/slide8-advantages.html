<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FFFFFF;
  font-family: Arial, sans-serif;
  display: flex;
}
.sidebar {
  width: 8pt;
  background: #722F37;
}
.content {
  flex: 1;
  padding: 35pt 50pt;
}
.title-wrapper {
  border-bottom: 3pt solid #D4AF37;
  padding-bottom: 10pt;
  margin-bottom: 25pt;
}
h2 {
  font-size: 36pt;
  color: #722F37;
  margin: 0;
  font-weight: bold;
}
.advantage-list {
  margin-top: 20pt;
}
.advantage-item {
  display: flex;
  align-items: flex-start;
  margin-bottom: 15pt;
  padding: 12pt;
  background: #F8F8F8;
  border-left: 4pt solid #722F37;
}
.advantage-icon {
  font-size: 28pt;
  color: #D4AF37;
  font-weight: bold;
  margin: 0 15pt 0 0;
  min-width: 35pt;
}
.advantage-content {
  flex: 1;
}
.advantage-title {
  font-size: 18pt;
  color: #722F37;
  font-weight: bold;
  margin: 0 0 6pt 0;
}
.advantage-desc {
  font-size: 13pt;
  color: #666666;
  margin: 0;
}
</style>
</head>
<body>
<div class="sidebar"></div>
<div class="content">
  <div class="title-wrapper">
    <h2>竞聘优势</h2>
  </div>
  <div class="advantage-list">
    <div class="advantage-item">
      <p class="advantage-icon">01</p>
      <div class="advantage-content">
        <p class="advantage-title">[优势1标题]</p>
        <p class="advantage-desc">[简要描述该优势的具体体现]</p>
      </div>
    </div>
    <div class="advantage-item">
      <p class="advantage-icon">02</p>
      <div class="advantage-content">
        <p class="advantage-title">[优势2标题]</p>
        <p class="advantage-desc">[简要描述该优势的具体体现]</p>
      </div>
    </div>
    <div class="advantage-item">
      <p class="advantage-icon">03</p>
      <div class="advantage-content">
        <p class="advantage-title">[优势3标题]</p>
        <p class="advantage-desc">[简要描述该优势的具体体现]</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>

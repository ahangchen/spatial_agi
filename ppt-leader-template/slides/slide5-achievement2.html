<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FFFFFF;
  font-family: Arial, sans-serif;
  display: flex;
}
.sidebar {
  width: 8pt;
  background: #722F37;
}
.content {
  flex: 1;
  padding: 35pt 50pt;
}
.header {
  display: flex;
  align-items: center;
  margin-bottom: 25pt;
  border-bottom: 3pt solid #D4AF37;
  padding-bottom: 12pt;
}
.number {
  font-size: 48pt;
  color: #D4AF37;
  font-weight: bold;
  margin: 0 15pt 0 0;
  min-width: 65pt;
}
h2 {
  font-size: 32pt;
  color: #722F37;
  margin: 0;
  font-weight: bold;
}
.detail-section {
  margin-top: 25pt;
}
.section-title {
  font-size: 16pt;
  color: #722F37;
  font-weight: bold;
  margin: 0 0 10pt 0;
}
.section-title-wrapper {
  padding-left: 12pt;
  border-left: 4pt solid #722F37;
  margin-bottom: 10pt;
}
.content-text {
  font-size: 14pt;
  color: #2C2C2C;
  line-height: 1.5;
  margin: 0 0 15pt 0;
}
.highlight-box {
  background: #F8F8F8;
  padding: 15pt;
  margin-top: 15pt;
  border-left: 4pt solid #D4AF37;
}
.highlight-label {
  font-size: 13pt;
  color: #666666;
  margin: 0 0 6pt 0;
}
.highlight-value {
  font-size: 20pt;
  color: #722F37;
  font-weight: bold;
  margin: 0;
}
</style>
</head>
<body>
<div class="sidebar"></div>
<div class="content">
  <div class="header">
    <p class="number">02</p>
    <h2>[业绩标题2]</h2>
  </div>
  <div class="detail-section">
    <div class="section-title-wrapper">
      <p class="section-title">项目背景</p>
    </div>
    <p class="content-text">[描述项目的背景、挑战和目标]</p>
    
    <div class="section-title-wrapper">
      <p class="section-title">核心贡献</p>
    </div>
    <p class="content-text">[描述你在项目中的关键作用和贡献]</p>
    
    <div class="highlight-box">
      <p class="highlight-label">核心成果</p>
      <p class="highlight-value">[具体量化指标或成果]</p>
    </div>
  </div>
</div>
</body>
</html>

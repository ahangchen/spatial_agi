<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FFFFFF;
  font-family: Arial, sans-serif;
  display: flex;
}
.sidebar {
  width: 8pt;
  background: #722F37;
}
.content {
  flex: 1;
  padding: 35pt 50pt;
}
.title-wrapper {
  border-bottom: 3pt solid #D4AF37;
  padding-bottom: 10pt;
  margin-bottom: 25pt;
}
h2 {
  font-size: 36pt;
  color: #722F37;
  margin: 0;
  font-weight: bold;
}
.content-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20pt;
  margin-top: 25pt;
}
.section-box {
  padding: 20pt;
  background: #F8F8F8;
  border-top: 3pt solid #722F37;
}
.section-title {
  font-size: 20pt;
  color: #722F37;
  font-weight: bold;
  margin: 0 0 15pt 0;
}
.item {
  margin-bottom: 10pt;
}
.item-title {
  font-size: 15pt;
  color: #D4AF37;
  font-weight: bold;
  margin: 0 0 5pt 0;
}
.item-desc {
  font-size: 13pt;
  color: #666666;
  margin: 0;
  line-height: 1.4;
}
</style>
</head>
<body>
<div class="sidebar"></div>
<div class="content">
  <div class="title-wrapper">
    <h2>PL职责与追求</h2>
  </div>
  <div class="content-grid">
    <div class="section-box">
      <p class="section-title">核心职责</p>
      <div class="item">
        <p class="item-title">技术引领</p>
        <p class="item-desc">把控技术方向，推动技术创新</p>
      </div>
      <div class="item">
        <p class="item-title">团队建设</p>
        <p class="item-desc">培养人才梯队，提升团队能力</p>
      </div>
      <div class="item">
        <p class="item-title">项目交付</p>
        <p class="item-desc">确保项目质量，按时完成交付</p>
      </div>
    </div>
    <div class="section-box">
      <p class="section-title">个人追求</p>
      <div class="item">
        <p class="item-title">卓越文化</p>
        <p class="item-desc">追求技术卓越，打造高质量产品</p>
      </div>
      <div class="item">
        <p class="item-title">团队成长</p>
        <p class="item-desc">赋能团队成员，实现共同进步</p>
      </div>
      <div class="item">
        <p class="item-title">价值创造</p>
        <p class="item-desc">聚焦业务价值，推动业务成功</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>

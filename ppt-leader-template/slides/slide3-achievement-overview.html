<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FFFFFF;
  font-family: Arial, sans-serif;
  display: flex;
}
.sidebar {
  width: 8pt;
  background: #722F37;
}
.content {
  flex: 1;
  padding: 35pt 50pt;
}
.title-wrapper {
  border-bottom: 3pt solid #D4AF37;
  padding-bottom: 8pt;
  margin-bottom: 20pt;
}
h2 {
  font-size: 34pt;
  color: #722F37;
  margin: 0;
  font-weight: bold;
}
.achievement-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15pt;
  margin-top: 15pt;
}
.achievement-card {
  padding: 18pt;
  background: #F8F8F8;
  border-top: 3pt solid #722F37;
}
.number {
  font-size: 32pt;
  color: #D4AF37;
  font-weight: bold;
  margin: 0 0 8pt 0;
}
.title {
  font-size: 17pt;
  color: #2C2C2C;
  font-weight: bold;
  margin: 0 0 6pt 0;
}
.desc {
  font-size: 12pt;
  color: #666666;
  margin: 0;
}
</style>
</head>
<body>
<div class="sidebar"></div>
<div class="content">
  <div class="title-wrapper">
    <h2>核心业绩总览</h2>
  </div>
  <div class="achievement-grid">
    <div class="achievement-card">
      <p class="number">01</p>
      <p class="title">[业绩标题1]</p>
      <p class="desc">[简要描述核心成果]</p>
    </div>
    <div class="achievement-card">
      <p class="number">02</p>
      <p class="title">[业绩标题2]</p>
      <p class="desc">[简要描述核心成果]</p>
    </div>
    <div class="achievement-card">
      <p class="number">03</p>
      <p class="title">[业绩标题3]</p>
      <p class="desc">[简要描述核心成果]</p>
    </div>
    <div class="achievement-card">
      <p class="number">04</p>
      <p class="title">[业绩标题4]</p>
      <p class="desc">[简要描述核心成果]</p>
    </div>
  </div>
</div>
</body>
</html>

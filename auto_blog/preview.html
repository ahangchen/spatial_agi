<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在Ubuntu上搭建专属AI助手：OpenClaw + GLM-4.7 + QQ Bot完整指南</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.8;
            color: #333;
            background: #f8f9fa;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .meta {
            color: #666;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }

        blockquote {
            border-left: 4px solid #3498db;
            padding-left: 20px;
            margin: 20px 0;
            color: #666;
            font-style: italic;
        }

        h2 {
            font-size: 1.8em;
            margin: 40px 0 20px 0;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }

        h3 {
            font-size: 1.4em;
            margin: 30px 0 15px 0;
            color: #34495e;
        }

        h4 {
            font-size: 1.2em;
            margin: 20px 0 10px 0;
            color: #34495e;
        }

        ul, ol {
            margin: 20px 0;
            padding-left: 30px;
        }

        li {
            margin: 10px 0;
        }

        code {
            background: #f4f4f4;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9em;
        }

        pre {
            background: #2d3748;
            color: #e2e8f0;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 20px 0;
        }

        pre code {
            background: none;
            padding: 0;
            color: inherit;
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 20px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .img-caption {
            font-size: 0.9em;
            color: #666;
            text-align: center;
            margin-top: -10px;
            margin-bottom: 20px;
            font-style: italic;
        }

        .placeholder {
            background: #f0f0f0;
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 60px 20px;
            text-align: center;
            color: #999;
            margin: 20px 0;
        }

        .placeholder strong {
            display: block;
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        .placeholder small {
            font-size: 0.9em;
        }

        .alert {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
        }

        .success {
            background: #d4edda;
            border-left: 4px solid #28a745;
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
        }

        .error {
            background: #f8d7da;
            border-left: 4px solid #dc3545;
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background: #3498db;
            color: white;
            font-weight: bold;
        }

        tr:nth-child(even) {

        }

        .toc {
            background: #ecf0f1;
            padding: 20px;
            border-radius: 8px;
            margin: 30px 0;
        }

        .toc h3 {
            margin-top: 0;
            color: #2c3e50;
        }

        .toc ul {
            list-style: none;
            padding-left: 0;
        }

        .toc li {
            margin: 5px 0;
        }

        .toc a {
            color: #3498db;

        }

        .toc a:hover {
            text-decoration: underline;
        }

        a {
            color: #3498db;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .footer {
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #666;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="content">
            <p>正在加载博客内容...</p>
        </div>
        <div class="footer">
            <p>最后更新：2026年2月17日 | 由OpenClaw自动生成</p>
        </div>
    </div>

    <script>
        // 加载并解析Markdown文件
        async function loadMarkdown() {
            try {
                const response = await fetch('ubuntu-openclaw-qqbot-guide.md');
                const markdown = await response.text();
                const html = parseMarkdown(markdown);
                document.getElementById('content').innerHTML = html;
            } catch (error) {
                document.getElementById('content').innerHTML = `
                    <div class="error">
                        加载失败: ${error.message}<br>
                        请确保在HTTP服务器中运行此页面，或直接查看Markdown文件。
                    </div>
                `;
            }
        }

        // 简单的Markdown解析器
        function parseMarkdown(markdown) {
            let html = markdown;

            // 处理标题
            html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
            html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
            html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
            html = html.replace(/^#### (.+)$/gm, '<h4>$1</h4>');

            // 处理引用
            html = html.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');

            // 处理代码块
            html = html.replace(/```(\w+)?\n([\s\S]+?)```/g, function(match, lang, code) {
                return `<pre><code class="language-${lang || 'text'}">${escapeHtml(code.trim())}</code></pre>`;
            });

            // 处理行内代码
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

            // 处理粗体
            html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

            // 处理斜体
            html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');

            // 处理图片
            html = html.replace(/!\[(.*?)\]\((.+?)\)\n*\*(.+?)\*/g,
                '<img src="$2" alt="$1"><p class="img-caption">$3</p>');

            // 处理图片（无说明）
            html = html.replace(/!\[(.*?)\]\((.+?)\)/g,
                '<img src="$2" alt="$1">');

            // 处理链接
            html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');

            // 处理无序列表
            html = html.replace(/^[\-•] (.+)$/gm, '<li>$1</li>');
            html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');

            // 处理有序列表
            html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');

            // 处理分隔线
            html = html.replace(/^---$/gm, '<hr>');

            // 处理段落
            html = html.replace(/\n\n/g, '</p><p>');
            html = '<p>' + html + '</p>';

            // 清理空段落
            html = html.replace(/<p>\s*<\/p>/g, '');
            html = html.replace(/<p>\s*(<h[1-6]>)/g, '$1');
            html = html.replace(/(<\/h[1-6]>)\s*<\/p>/g, '$1');
            html = html.replace(/<p>\s*(<pre>)/g, '$1');
            html = html.replace(/(<\/pre>)\s*<\/p>/g, '$1');
            html = html.replace(/<p>\s*(<blockquote>)/g, '$1');
            html = html.replace(/(<\/blockquote>)\s*<\/p>/g, '$1');
            html = html.replace(/<p>\s*(<ul>)/g, '$1');
            html = html.replace(/(<\/ul>)\s*<\/p>/g, '$1');

            // 处理特殊字符
            html = html.replace(/&gt;/g, '>');
            html = html.replace(/&lt;/g, '<');
            html = html.replace(/&amp;/g, '&');

            return html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 页面加载时执行
        loadMarkdown();
    </script>
</body>
</html>

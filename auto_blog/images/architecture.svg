<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="400" y="40" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">
    系统架构示意图
  </text>

  <!-- User/Phone -->
  <g transform="translate(50, 150)">
    <rect x="0" y="0" width="120" height="200" rx="10" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
    <text x="60" y="30" font-size="14" text-anchor="middle" fill="#333">QQ客户端</text>
    <text x="60" y="50" font-size="12" text-anchor="middle" fill="#666">用户</text>
    <circle cx="60" cy="100" r="30" fill="#2196f3" opacity="0.2"/>
    <text x="60" y="105" font-size="10" text-anchor="middle" fill="#666">消息</text>
  </g>

  <!-- QQ Bot -->
  <g transform="translate(220, 150)">
    <rect x="0" y="0" width="120" height="200" rx="10" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
    <text x="60" y="30" font-size="14" text-anchor="middle" fill="#333">QQ Bot</text>
    <text x="60" y="50" font-size="12" text-anchor="middle" fill="#666">机器人</text>
    <circle cx="60" cy="100" r="30" fill="#9c27b0" opacity="0.2"/>
    <text x="60" y="105" font-size="10" text-anchor="middle" fill="#666">API</text>
  </g>

  <!-- OpenClaw -->
  <g transform="translate(390, 120)">
    <rect x="0" y="0" width="140" height="260" rx="10" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
    <text x="70" y="30" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">OpenClaw</text>
    <text x="70" y="50" font-size="12" text-anchor="middle" fill="#666">Gateway</text>

    <!-- Components -->
    <rect x="10" y="70" width="120" height="40" rx="5" fill="#ffcc80" opacity="0.5"/>
    <text x="70" y="95" font-size="11" text-anchor="middle" fill="#333">会话管理</text>

    <rect x="10" y="120" width="120" height="40" rx="5" fill="#ffcc80" opacity="0.5"/>
    <text x="70" y="145" font-size="11" text-anchor="middle" fill="#333">技能系统</text>

    <rect x="10" y="170" width="120" height="40" rx="5" fill="#ffcc80" opacity="0.5"/>
    <text x="70" y="195" font-size="11" text-anchor="middle" fill="#333">消息路由</text>

    <rect x="10" y="220" width="120" height="25" rx="5" fill="#ffcc80" opacity="0.5"/>
    <text x="70" y="237" font-size="10" text-anchor="middle" fill="#333">Cron/提醒</text>
  </g>

  <!-- GLM-4.7 -->
  <g transform="translate(570, 150)">
    <rect x="0" y="0" width="120" height="200" rx="10" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
    <text x="60" y="30" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">GLM-4.7</text>
    <text x="60" y="50" font-size="12" text-anchor="middle" fill="#666">Z.AI</text>
    <circle cx="60" cy="100" r="30" fill="#4caf50" opacity="0.2"/>
    <text x="60" y="105" font-size="10" text-anchor="middle" fill="#666">AI模型</text>
  </g>

  <!-- Arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- User -> QQ Bot -->
  <line x1="170" y1="250" x2="220" y2="250" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="195" y="240" font-size="10" text-anchor="middle" fill="#666">消息</text>

  <!-- QQ Bot -> OpenClaw -->
  <line x1="340" y1="250" x2="390" y2="250" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="365" y="240" font-size="10" text-anchor="middle" fill="#666">API调用</text>

  <!-- OpenClaw -> GLM-4.7 -->
  <line x1="530" y1="250" x2="570" y2="250" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="550" y="240" font-size="10" text-anchor="middle" fill="#666">请求</text>

  <!-- Ubuntu Server Box -->
  <rect x="200" y="100" width="490" height="350" rx="10" fill="none" stroke="#999" stroke-width="2" stroke-dasharray="10,5"/>
  <text x="445" y="470" font-size="12" text-anchor="middle" fill="#999">Ubuntu 服务器</text>

  <!-- Legend -->
  <g transform="translate(50, 420)">
    <text x="0" y="0" font-size="12" font-weight="bold" fill="#333">图例：</text>
    <rect x="0" y="15" width="15" height="15" fill="#e3f2fd" stroke="#2196f3"/>
    <text x="25" y="27" font-size="11" fill="#666">用户端</text>

    <rect x="100" y="15" width="15" height="15" fill="#f3e5f5" stroke="#9c27b0"/>
    <text x="125" y="27" font-size="11" fill="#666">QQ Bot</text>

    <rect x="200" y="15" width="15" height="15" fill="#fff3e0" stroke="#ff9800"/>
    <text x="225" y="27" font-size="11" fill="#666">OpenClaw</text>

    <rect x="310" y="15" width="15" height="15" fill="#e8f5e9" stroke="#4caf50"/>
    <text x="335" y="27" font-size="11" fill="#666">GLM-4.7</text>
  </g>
</svg>
